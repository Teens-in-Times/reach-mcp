[package]
name = "reach-mcp"
version = "0.3.0"
edition = "2024"
license = "MIT"
description = "Independent native remote hand for an MCP client"

[dependencies]
anyhow = "1"
base64 = "0.22"
axum = "0.8"
clap = { version = "4", features = ["derive"] }
fs2 = "0.4"
globset = "0.4"
getrandom = "0.4"
ignore = "0.4"
regex = "1"
rmcp = { version = "=3.5.0", default-features = false, features = ["server", "transport-streamable-http-server"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2"
tempfile = "3"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
uuid = { version = "1", features = ["v4", "serde"] }
schemars = { version = "1.2.3", features = ["derive", "uuid1"] }
portable-pty = "0.9.0"
vt100 = "0.18.1"
similar = "3.2.0"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_System_Pipes", "Win32_System_LibraryLoader"] }

[profile.release]
strip = true
lto = "thin"


[[bin]]
name = "reach"
path = "src/main.rs"
